<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" width="960" height="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#047857"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="960" height="555" fill="#ffffff"/>

  <!-- TOP ROW: External Clients, AI APIs, Meeting Platforms -->
  <rect x="35" y="14" width="175" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="122" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">End Users (Web UI)</text>
  <text x="122" y="56" text-anchor="middle" font-size="10.5" fill="#475569">Browser / HTTPS</text>

  <rect x="250" y="14" width="215" height="58" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="357" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">OpenAI &amp; Google APIs</text>
  <text x="357" y="56" text-anchor="middle" font-size="10.5" fill="#6d28d9">GPT / Embeddings / Calendar</text>

  <rect x="492" y="14" width="192" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="588" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">ElevenLabs Live API</text>
  <text x="588" y="56" text-anchor="middle" font-size="10.5" fill="#92400e">Scribe v2 Realtime WebSocket</text>

  <rect x="708" y="14" width="218" height="58" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="817" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Meeting Platforms</text>
  <text x="817" y="56" text-anchor="middle" font-size="10.5" fill="#047857">Google Meet / MS Teams / Zoom</text>

  <!-- GCP REGION CONTAINER -->
  <path d="M 20 112 L 940 112 L 940 426 L 680 426 L 680 540 L 20 540 Z" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="34" y="101" width="335" height="22" rx="4" fill="#2563eb"/>
  <text x="201" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Google Cloud Platform (GCP) — europe-west1 VPC</text>

  <!-- Cloud Load Balancing / Ingress -->
  <rect x="36" y="156" width="166" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="119" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Cloud Load Balancer</text>
  <text x="119" y="201" text-anchor="middle" font-size="10" fill="#1d4ed8">GKE Ingress (HTTPS / TLS)</text>

  <!-- Locust Load Simulator -->
  <rect x="36" y="274" width="166" height="68" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="119" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#881337">Locust Load Generator</text>
  <text x="119" y="316" text-anchor="middle" font-size="10" fill="#be123c">Traffic &amp; Scalability Tests</text>
  <text x="119" y="330" text-anchor="middle" font-size="9.5" fill="#be123c">(Phase 4 Evaluation)</text>

  <!-- Artifact Registry -->
  <rect x="36" y="394" width="166" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="119" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Artifact Registry</text>
  <text x="119" y="437" text-anchor="middle" font-size="10" fill="#475569">Docker Container Images</text>

  <!-- GKE ZONAL CLUSTER -->
  <rect x="242" y="142" width="416" height="248" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M 242 152 Q 242 142 252 142 L 648 142 Q 658 142 658 152 L 658 164 L 242 164 Z" fill="#1d4ed8"/>
  <text x="450" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">GKE Zonal Cluster (Kubernetes + HPA)</text>

  <!-- mia-frontend -->
  <rect x="258" y="190" width="140" height="70" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="328" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">mia-frontend</text>
  <text x="328" y="228" text-anchor="middle" font-size="10" fill="#475569">React + Nginx (:80)</text>
  <rect x="281" y="236" width="94" height="16" rx="3" fill="#dbeafe"/>
  <text x="328" y="247" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Deployment</text>

  <!-- mia-backend -->
  <rect x="422" y="190" width="218" height="78" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="531" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">mia-backend</text>
  <text x="531" y="228" text-anchor="middle" font-size="10" fill="#475569">Go Fiber API + Workers (:8080)</text>
  <rect x="468" y="240" width="126" height="18" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="531" y="252" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">HPA (1–5 Pods)</text>

  <!-- mia-search -->
  <rect x="258" y="302" width="222" height="74" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="369" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">mia-search</text>
  <text x="369" y="340" text-anchor="middle" font-size="10" fill="#475569">Python FastAPI NLP/RAG (:8000)</text>
  <rect x="306" y="350" width="126" height="18" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="369" y="362" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">HPA (1–4 Pods)</text>

  <!-- Cloud SQL (PostgreSQL + pgvector) -->
  <rect x="242" y="432" width="416" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#164e63">Cloud SQL for PostgreSQL 16 (+ pgvector)</text>
  <text x="450" y="477" text-anchor="middle" font-size="10.5" fill="#155e75">db-g1-small • Managed Relational + Vector Store</text>
  <text x="450" y="496" text-anchor="middle" font-size="10" fill="#0e7490">Users • Meetings • Live transcript_segments • Summaries • Decisions • Embeddings</text>

  <!-- GCE VM: meeting-bot -->
  <rect x="702" y="142" width="224" height="126" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <path d="M 702 152 Q 702 142 712 142 L 916 142 Q 926 142 926 152 L 926 164 L 702 164 Z" fill="#ca8a04"/>
  <text x="814" y="157" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Compute Engine (GCE VM)</text>
  <text x="814" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">meeting-bot (e2-medium)</text>
  <text x="814" y="201" text-anchor="middle" font-size="10" fill="#854d0e">Playwright + Chromium + Xvfb</text>
  <text x="814" y="217" text-anchor="middle" font-size="10" fill="#854d0e">ONNX VAD + Speaker Detection</text>
  <text x="814" y="233" text-anchor="middle" font-size="10" fill="#854d0e">Live Audio Stream &amp; HTTP API (:3000)</text>
  <text x="814" y="253" text-anchor="middle" font-size="9.5" font-weight="600" fill="#a16207">Stateful 30–60 min WebRTC Sessions</text>

  <!-- Cloud Function: brief-notifier -->
  <rect x="702" y="302" width="224" height="104" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <path d="M 702 312 Q 702 302 712 302 L 916 302 Q 926 302 926 312 L 926 324 L 702 324 Z" fill="#7c3aed"/>
  <text x="814" y="317" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Cloud Functions (2nd Gen)</text>
  <text x="814" y="346" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">brief-notifier</text>
  <text x="814" y="365" text-anchor="middle" font-size="10" fill="#5b21b6">Serverless Python HTTP Handler</text>
  <text x="814" y="384" text-anchor="middle" font-size="9.5" fill="#6d28d9">Pre-Meeting Brief &amp; Summary Alerts</text>

  <!-- External Notification Targets -->
  <rect x="705" y="458" width="218" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="814" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Email (SMTP) &amp; Slack</text>
  <text x="814" y="502" text-anchor="middle" font-size="10" fill="#475569">External Notification Channels</text>

  <!-- ARROWS / INTERACTIONS -->
  <!-- End Users -> Cloud LB -->
  <line x1="119" y1="72" x2="119" y2="153" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="126" y="135" font-size="9" font-weight="600" fill="#334155">HTTPS</text>

  <!-- Locust -> Cloud LB -->
  <line x1="119" y1="274" x2="119" y2="225" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="126" y="253" font-size="9" font-weight="600" fill="#be123c">Load</text>

  <!-- Cloud LB -> mia-frontend -->
  <line x1="202" y1="202" x2="255" y2="202" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- Cloud LB -> mia-backend (in clean corridor y=177 under GKE header) -->
  <path d="M 202 177 L 456 177 L 456 187" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="328" y="173" text-anchor="middle" font-size="8.8" font-weight="600" fill="#1e40af">/api/*</text>

  <!-- mia-frontend -> mia-backend -->
  <line x1="398" y1="224" x2="419" y2="224" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- mia-backend <-> mia-search -->
  <path d="M 450 268 L 450 299" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="442" y="287" text-anchor="end" font-size="8.8" font-weight="600" fill="#1e40af">Internal HTTP</text>

  <!-- mia-backend -> Cloud SQL -->
  <path d="M 531 268 L 531 429" fill="none" stroke="#0891b2" stroke-width="1.6" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="537" y="346" font-size="9" font-weight="600" fill="#0e7490">pgx / SQL</text>

  <!-- mia-search -> Cloud SQL -->
  <line x1="369" y1="376" x2="369" y2="429" stroke="#0891b2" stroke-width="1.6" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="375" y="410" font-size="9" font-weight="600" fill="#0e7490">pgvector</text>

  <!-- mia-backend <-> meeting-bot VM -->
  <line x1="640" y1="210" x2="699" y2="210" stroke="#b45309" stroke-width="1.6" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="670" y="201" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400e">HTTP</text>

  <!-- meeting-bot VM -> Cloud SQL (clean gap routing at y=282) -->
  <path d="M 702 254 L 670 254 L 670 282 L 605 282 L 605 429" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-amber)"/>
  <text x="600" y="408" text-anchor="end" font-size="8.5" font-weight="600" fill="#92400e">Live Segments</text>

  <!-- mia-backend -> brief-notifier Cloud Function -->
  <path d="M 640 232 L 684 232 L 684 360 L 699 360" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="678" y="328" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6d28d9" transform="rotate(-90 678 328)">HTTP POST</text>

  <!-- brief-notifier -> Email & Slack -->
  <line x1="814" y1="406" x2="814" y2="455" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="822" y="442" font-size="9" font-weight="600" fill="#5b21b6">SMTP / Webhook</text>

  <!-- mia-backend -> OpenAI & Google APIs (exits top of GKE right of title, or clean channel) -->
  <path d="M 555 190 L 555 174 L 598 174 L 598 126 L 412 126 L 412 75" fill="none" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- mia-search -> OpenAI APIs (routed cleanly in gap at x=222) -->
  <path d="M 258 334 L 222 334 L 222 132 L 395 132 L 395 92 L 330 92 L 330 75" fill="none" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- meeting-bot -> ElevenLabs Live API -->
  <path d="M 748 142 L 748 92 L 588 92 L 588 75" fill="none" stroke="#b45309" stroke-width="1.7" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="668" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">PCM WebSocket</text>

  <!-- meeting-bot <-> Meeting Platforms -->
  <line x1="825" y1="142" x2="825" y2="75" stroke="#047857" stroke-width="1.7" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="833" y="96" font-size="9" font-weight="600" fill="#065f46">WebRTC</text>
</svg>

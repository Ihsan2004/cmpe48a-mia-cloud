<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 518" width="980" height="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#047857"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#be123c"/>
    </marker>
  </defs>

  <rect width="980" height="518" fill="#ffffff"/>

  <!-- EXTERNAL TOP ROW -->
  <rect x="196" y="12" width="146" height="52" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="269" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">End Users (Web UI)</text>
  <text x="269" y="50" text-anchor="middle" font-size="9.5" fill="#475569">Browser / HTTPS</text>

  <rect x="366" y="12" width="186" height="52" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="459" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">OpenAI &amp; Google APIs</text>
  <text x="459" y="50" text-anchor="middle" font-size="9.5" fill="#6d28d9">GPT / Embeddings / Calendar</text>

  <rect x="572" y="12" width="174" height="52" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="659" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">ElevenLabs Live API</text>
  <text x="659" y="50" text-anchor="middle" font-size="9.5" fill="#92400e">Scribe v2 Realtime WS</text>

  <rect x="766" y="12" width="194" height="52" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <text x="863" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Meeting Platforms</text>
  <text x="863" y="50" text-anchor="middle" font-size="9.5" fill="#047857">Meet / Teams / Zoom</text>

  <!-- EXTERNAL LEFT: LOCUST LOAD GENERATOR (OUTSIDE GCP VPC) -->
  <rect x="8" y="146" width="138" height="68" rx="7" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="77" y="170" text-anchor="middle" font-size="11.2" font-weight="700" fill="#881337">Locust Load Gen</text>
  <text x="77" y="186" text-anchor="middle" font-size="9.3" fill="#be123c">External Client</text>
  <text x="77" y="201" text-anchor="middle" font-size="8.8" fill="#be123c">(Load &amp; Stress Tests)</text>

  <!-- GCP REGION VPC BOUNDARY (excludes Locust on left & Email Delivery on bottom-right) -->
  <path d="M 180 104 L 972 104 L 972 400 L 704 400 L 704 514 L 180 514 Z" fill="#f8fafc" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6,4"/>
  <rect x="194" y="93" width="306" height="20" rx="4" fill="#2563eb"/>
  <text x="347" y="107" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Google Cloud Platform (GCP) — europe-west1 VPC</text>

  <!-- Cloud Load Balancer -->
  <rect x="196" y="146" width="146" height="66" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="269" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Cloud Load Balancer</text>
  <text x="269" y="191" text-anchor="middle" font-size="9.5" fill="#1d4ed8">GKE Ingress (HTTPS / TLS)</text>

  <!-- Artifact Registry (Bottom-left inside VPC so center corridors stay uncluttered) -->
  <rect x="196" y="422" width="146" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="269" y="449" text-anchor="middle" font-size="11.3" font-weight="700" fill="#334155">Artifact Registry</text>
  <text x="269" y="466" text-anchor="middle" font-size="9.3" fill="#475569">Docker Container Images</text>

  <!-- GKE ZONAL CLUSTER -->
  <rect x="370" y="134" width="310" height="238" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="382" y="125" width="218" height="19" rx="4" fill="#1d4ed8"/>
  <text x="491" y="138" text-anchor="middle" font-size="10.2" font-weight="700" fill="#ffffff">GKE Zonal Cluster (Kubernetes + HPA)</text>

  <!-- mia-frontend -->
  <rect x="382" y="176" width="110" height="68" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="437" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">mia-frontend</text>
  <text x="437" y="213" text-anchor="middle" font-size="9.2" fill="#475569">React + Nginx (:80)</text>
  <rect x="395" y="221" width="84" height="15" rx="3" fill="#dbeafe"/>
  <text x="437" y="232" text-anchor="middle" font-size="8.6" font-weight="600" fill="#1e40af">Deployment</text>

  <!-- mia-backend -->
  <rect x="508" y="172" width="160" height="74" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="588" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">mia-backend</text>
  <text x="588" y="208" text-anchor="middle" font-size="9.2" fill="#475569">Go Fiber API + Workers (:8080)</text>
  <rect x="528" y="218" width="120" height="17" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="588" y="230" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">HPA (1–5 Pods)</text>

  <!-- mia-search -->
  <rect x="382" y="284" width="164" height="70" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="464" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">mia-search</text>
  <text x="464" y="320" text-anchor="middle" font-size="9.2" fill="#475569">Python FastAPI NLP (:8000)</text>
  <rect x="404" y="329" width="120" height="17" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="464" y="341" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">HPA (1–4 Pods)</text>

  <!-- Cloud SQL (PostgreSQL + pgvector) -->
  <rect x="370" y="410" width="310" height="74" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="525" y="432" text-anchor="middle" font-size="11.8" font-weight="700" fill="#164e63">Cloud SQL for PostgreSQL 16 (+ pgvector)</text>
  <text x="525" y="449" text-anchor="middle" font-size="9.6" fill="#155e75">db-g1-small • Managed Relational + Vector Store</text>
  <text x="525" y="466" text-anchor="middle" font-size="8.5" fill="#0e7490">Users • Meetings • transcript_segments • Decisions • Embeddings</text>

  <!-- GCE VM: meeting-bot -->
  <rect x="742" y="134" width="212" height="118" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <path d="M 742 144 Q 742 134 752 134 L 944 134 Q 954 134 954 144 L 954 155 L 742 155 Z" fill="#ca8a04"/>
  <text x="848" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Compute Engine (GCE VM)</text>
  <text x="848" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#713f12">meeting-bot (e2-medium)</text>
  <text x="848" y="190" text-anchor="middle" font-size="9.3" fill="#854d0e">Playwright + Chromium + Xvfb</text>
  <text x="848" y="205" text-anchor="middle" font-size="9.3" fill="#854d0e">ONNX VAD + Speaker Detection</text>
  <text x="848" y="220" text-anchor="middle" font-size="9.3" fill="#854d0e">Live Audio Stream &amp; HTTP API (:3000)</text>
  <text x="848" y="239" text-anchor="middle" font-size="8.9" font-weight="600" fill="#a16207">Stateful 30–60 min WebRTC Sessions</text>

  <!-- Cloud Function: brief-notifier -->
  <rect x="742" y="282" width="212" height="96" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <path d="M 742 292 Q 742 282 752 282 L 944 282 Q 954 282 954 292 L 954 303 L 742 303 Z" fill="#7c3aed"/>
  <text x="848" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Cloud Functions (2nd Gen)</text>
  <text x="848" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">brief-notifier</text>
  <text x="848" y="342" text-anchor="middle" font-size="9.4" fill="#5b21b6">Serverless Python HTTP Handler</text>
  <text x="848" y="359" text-anchor="middle" font-size="9.2" fill="#6d28d9">Pre-Meeting Brief Email Delivery</text>

  <!-- External Email Target (OUTSIDE VPC) -->
  <rect x="742" y="428" width="212" height="58" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="848" y="453" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Email Delivery (SMTP)</text>
  <text x="848" y="470" text-anchor="middle" font-size="9.5" fill="#475569">External Mail Relay</text>

  <!-- ARROWS / INTERACTIONS -->
  <!-- End Users -> Cloud LB -->
  <line x1="269" y1="64" x2="269" y2="143" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="128" font-size="8.8" font-weight="600" fill="#334155">HTTPS</text>

  <!-- Locust (outside VPC) -> Cloud LB (wide 34px gap x=146..180) -->
  <line x1="146" y1="180" x2="193" y2="180" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arrow-rose)"/>
  <text x="163" y="172" text-anchor="middle" font-size="8.8" font-weight="700" fill="#be123c">Load</text>

  <!-- Cloud LB -> mia-frontend -->
  <line x1="342" y1="198" x2="379" y2="198" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Cloud LB -> mia-backend (clean corridor y=162 above mia-frontend) -->
  <path d="M 342 162 L 542 162 L 542 169" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="444" y="157" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1e40af">/api/* &amp; /ws/*</text>

  <!-- mia-frontend -> mia-backend -->
  <line x1="492" y1="210" x2="505" y2="210" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

  <!-- mia-backend <-> mia-search -->
  <path d="M 526 246 L 526 281" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="520" y="268" text-anchor="end" font-size="8.2" font-weight="600" fill="#1e40af">Internal HTTP</text>

  <!-- Artifact Registry -> GKE (image pull via bottom-left, clear of mia-search -> OpenAI) -->
  <path d="M 269 422 L 269 346 L 367 346" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="318" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">image pull</text>

  <!-- Artifact Registry -> GCE VM (clean outer perimeter corridor y=503 -> x=716 -> y=390 -> x=964 -> y=194) -->
  <path d="M 342 464 L 355 464 L 355 503 L 716 503 L 716 390 L 964 390 L 964 194 L 957 194" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="525" y="497" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">image pull (GCE VM)</text>

  <!-- mia-backend -> Cloud SQL -->
  <path d="M 586 246 L 586 407" fill="none" stroke="#0891b2" stroke-width="1.5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="580" y="384" text-anchor="end" font-size="8.6" font-weight="600" fill="#0e7490">pgx / SQL</text>

  <!-- mia-search -> Cloud SQL -->
  <line x1="464" y1="354" x2="464" y2="407" stroke="#0891b2" stroke-width="1.5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="470" y="384" font-size="8.6" font-weight="600" fill="#0e7490">pgvector</text>

  <!-- mia-backend <-> meeting-bot VM -->
  <line x1="668" y1="194" x2="739" y2="194" stroke="#b45309" stroke-width="1.5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="704" y="187" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400e">HTTP</text>

  <!-- meeting-bot VM -> Cloud SQL (amber stream routed through y=264 -> x=658) -->
  <path d="M 758 252 L 758 264 L 658 264 L 658 407" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-amber)"/>
  <text x="653" y="330" text-anchor="end" font-size="8.3" font-weight="600" fill="#92400e">Live Segments</text>

  <!-- mia-backend -> brief-notifier Cloud Function (clean horizontal unrotated label) -->
  <path d="M 668 220 L 700 220 L 700 330 L 739 330" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="720" y="294" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">HTTP</text>
  <text x="720" y="304" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">POST</text>

  <!-- brief-notifier -> Email (SMTP) -->
  <line x1="848" y1="378" x2="848" y2="425" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="856" y="416" font-size="8.8" font-weight="600" fill="#5b21b6">SMTP</text>

  <!-- mia-backend -> OpenAI & Google APIs (exits right of GKE badge without hitting header bar) -->
  <path d="M 632 172 L 632 82 L 506 82 L 506 67" fill="none" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- mia-search -> OpenAI APIs (routed at x=354 cleanly above Artifact Registry y=346) -->
  <path d="M 382 306 L 354 306 L 354 118 L 520 118 L 520 88 L 430 88 L 430 67" fill="none" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- meeting-bot -> ElevenLabs Live API -->
  <path d="M 780 134 L 780 86 L 659 86 L 659 67" fill="none" stroke="#b45309" stroke-width="1.6" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="720" y="80" text-anchor="middle" font-size="8.6" font-weight="700" fill="#92400e">PCM WebSocket</text>

  <!-- meeting-bot <-> Meeting Platforms -->
  <line x1="863" y1="134" x2="863" y2="67" stroke="#047857" stroke-width="1.6" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="871" y="88" font-size="8.8" font-weight="600" fill="#065f46">WebRTC</text>
</svg>

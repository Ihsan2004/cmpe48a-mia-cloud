<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 555" width="980" height="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#047857"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#be123c"/>
    </marker>
  </defs>

  <rect width="980" height="555" fill="#ffffff"/>

  <!-- EXTERNAL TOP ROW -->
  <rect x="194" y="14" width="146" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="267" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">End Users (Web UI)</text>
  <text x="267" y="56" text-anchor="middle" font-size="10" fill="#475569">Browser / HTTPS</text>

  <rect x="364" y="14" width="186" height="58" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="457" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">OpenAI &amp; Google APIs</text>
  <text x="457" y="56" text-anchor="middle" font-size="10" fill="#6d28d9">GPT / Embeddings / Calendar</text>

  <rect x="572" y="14" width="174" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="659" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">ElevenLabs Live API</text>
  <text x="659" y="56" text-anchor="middle" font-size="10" fill="#92400e">Scribe v2 Realtime WS</text>

  <rect x="766" y="14" width="194" height="58" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="863" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Meeting Platforms</text>
  <text x="863" y="56" text-anchor="middle" font-size="10" fill="#047857">Meet / Teams / Zoom</text>

  <!-- EXTERNAL LEFT: LOCUST LOAD GENERATOR (OUTSIDE GCP VPC) -->
  <rect x="12" y="154" width="144" height="72" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="84" y="179" text-anchor="middle" font-size="11.5" font-weight="700" fill="#881337">Locust Load Gen</text>
  <text x="84" y="196" text-anchor="middle" font-size="9.5" fill="#be123c">External Client</text>
  <text x="84" y="211" text-anchor="middle" font-size="9" fill="#be123c">(Load &amp; Stress Tests)</text>

  <!-- GCP REGION CONTAINER (starts at x=178, keeping Locust outside) -->
  <path d="M 178 112 L 968 112 L 968 426 L 704 426 L 704 540 L 178 540 Z" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="192" y="101" width="318" height="22" rx="4" fill="#2563eb"/>
  <text x="351" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Google Cloud Platform (GCP) — europe-west1 VPC</text>

  <!-- Cloud Load Balancing / Ingress -->
  <rect x="194" y="154" width="146" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="267" y="182" text-anchor="middle" font-size="11.8" font-weight="700" fill="#1e3a8a">Cloud Load Balancer</text>
  <text x="267" y="200" text-anchor="middle" font-size="9.8" fill="#1d4ed8">GKE Ingress (HTTPS / TLS)</text>

  <!-- Artifact Registry -->
  <rect x="194" y="302" width="146" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="267" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Artifact Registry</text>
  <text x="267" y="348" text-anchor="middle" font-size="9.5" fill="#475569">Docker Container Images</text>

  <!-- GKE ZONAL CLUSTER -->
  <rect x="368" y="142" width="320" height="248" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M 368 152 Q 368 142 378 142 L 678 142 Q 688 142 688 152 L 688 164 L 368 164 Z" fill="#1d4ed8"/>
  <text x="528" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">GKE Zonal Cluster (Kubernetes + HPA)</text>

  <!-- mia-frontend -->
  <rect x="380" y="190" width="114" height="70" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="437" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">mia-frontend</text>
  <text x="437" y="228" text-anchor="middle" font-size="9.5" fill="#475569">React + Nginx (:80)</text>
  <rect x="394" y="236" width="86" height="16" rx="3" fill="#dbeafe"/>
  <text x="437" y="247" text-anchor="middle" font-size="8.8" font-weight="600" fill="#1e40af">Deployment</text>

  <!-- mia-backend -->
  <rect x="510" y="190" width="166" height="78" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="593" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">mia-backend</text>
  <text x="593" y="227" text-anchor="middle" font-size="9.5" fill="#475569">Go Fiber API + Workers (:8080)</text>
  <rect x="532" y="239" width="122" height="18" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="593" y="251" text-anchor="middle" font-size="9.2" font-weight="700" fill="#166534">HPA (1–5 Pods)</text>

  <!-- mia-search -->
  <rect x="380" y="304" width="174" height="74" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="467" y="325" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">mia-search</text>
  <text x="467" y="341" text-anchor="middle" font-size="9.5" fill="#475569">Python FastAPI NLP (:8000)</text>
  <rect x="406" y="351" width="122" height="18" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="467" y="363" text-anchor="middle" font-size="9.2" font-weight="700" fill="#166534">HPA (1–4 Pods)</text>

  <!-- Cloud SQL (PostgreSQL + pgvector) -->
  <rect x="368" y="432" width="320" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="528" y="458" text-anchor="middle" font-size="12.5" font-weight="700" fill="#164e63">Cloud SQL for PostgreSQL 16 (+ pgvector)</text>
  <text x="528" y="476" text-anchor="middle" font-size="10" fill="#155e75">db-g1-small • Managed Relational + Vector Store</text>
  <text x="528" y="495" text-anchor="middle" font-size="9.5" fill="#0e7490">Users • Meetings • Live transcript_segments • Decisions • Embeddings</text>

  <!-- GCE VM: meeting-bot -->
  <rect x="724" y="142" width="228" height="126" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <path d="M 724 152 Q 724 142 734 142 L 942 142 Q 952 142 952 152 L 952 164 L 724 164 Z" fill="#ca8a04"/>
  <text x="838" y="157" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Compute Engine (GCE VM)</text>
  <text x="838" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">meeting-bot (e2-medium)</text>
  <text x="838" y="201" text-anchor="middle" font-size="9.8" fill="#854d0e">Playwright + Chromium + Xvfb</text>
  <text x="838" y="217" text-anchor="middle" font-size="9.8" fill="#854d0e">ONNX VAD + Speaker Detection</text>
  <text x="838" y="233" text-anchor="middle" font-size="9.8" fill="#854d0e">Live Audio Stream &amp; HTTP API (:3000)</text>
  <text x="838" y="253" text-anchor="middle" font-size="9.2" font-weight="600" fill="#a16207">Stateful 30–60 min WebRTC Sessions</text>

  <!-- Cloud Function: brief-notifier -->
  <rect x="724" y="302" width="228" height="104" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <path d="M 724 312 Q 724 302 734 302 L 942 302 Q 952 302 952 312 L 952 324 L 724 324 Z" fill="#7c3aed"/>
  <text x="838" y="317" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Cloud Functions (2nd Gen)</text>
  <text x="838" y="346" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">brief-notifier</text>
  <text x="838" y="365" text-anchor="middle" font-size="9.8" fill="#5b21b6">Serverless Python HTTP Handler</text>
  <text x="838" y="384" text-anchor="middle" font-size="9.5" fill="#6d28d9">Pre-Meeting Brief Email Delivery</text>

  <!-- External Email Target (OUTSIDE VPC) -->
  <rect x="728" y="458" width="220" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="838" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Email Delivery (SMTP)</text>
  <text x="838" y="502" text-anchor="middle" font-size="10" fill="#475569">External Mail Relay</text>

  <!-- ARROWS / INTERACTIONS -->
  <!-- End Users -> Cloud LB -->
  <line x1="267" y1="72" x2="267" y2="151" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="274" y="136" font-size="9" font-weight="600" fill="#334155">HTTPS</text>

  <!-- Locust (outside VPC) -> Cloud LB (across VPC border) -->
  <line x1="156" y1="190" x2="191" y2="190" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arrow-rose)"/>
  <text x="167" y="182" text-anchor="middle" font-size="8.8" font-weight="700" fill="#be123c">Load</text>

  <!-- Cloud LB -> mia-frontend -->
  <line x1="340" y1="205" x2="377" y2="205" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- Cloud LB -> mia-backend (clean corridor y=177) -->
  <path d="M 340 177 L 542 177 L 542 187" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="440" y="173" text-anchor="middle" font-size="8.6" font-weight="600" fill="#1e40af">/api/* &amp; /ws/*</text>

  <!-- mia-frontend -> mia-backend -->
  <line x1="494" y1="224" x2="507" y2="224" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- mia-backend <-> mia-search -->
  <path d="M 532 268 L 532 301" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="537" y="294" font-size="8.4" font-weight="600" fill="#1e40af">Internal HTTP</text>

  <!-- Artifact Registry -> GKE & GCE VM (image pull) -->
  <line x1="340" y1="336" x2="365" y2="336" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="353" y="328" text-anchor="middle" font-size="7.8" fill="#475569">pull</text>
  <path d="M 267 302 L 267 276 L 705 276 L 705 242 L 721 242" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="430" y="272" text-anchor="middle" font-size="7.8" fill="#475569">image pull</text>

  <!-- mia-backend -> Cloud SQL -->
  <path d="M 604 268 L 604 429" fill="none" stroke="#0891b2" stroke-width="1.6" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="610" y="346" font-size="8.8" font-weight="600" fill="#0e7490">pgx / SQL</text>

  <!-- mia-search -> Cloud SQL -->
  <line x1="467" y1="378" x2="467" y2="429" stroke="#0891b2" stroke-width="1.6" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text x="473" y="410" font-size="8.8" font-weight="600" fill="#0e7490">pgvector</text>

  <!-- mia-backend <-> meeting-bot VM -->
  <line x1="676" y1="210" x2="721" y2="210" stroke="#b45309" stroke-width="1.6" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="699" y="201" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400e">HTTP</text>

  <!-- meeting-bot VM -> Cloud SQL (clean gap routing at y=292) -->
  <path d="M 724 256 L 696 256 L 696 292 L 656 292 L 656 429" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-amber)"/>
  <text x="651" y="412" text-anchor="end" font-size="8.4" font-weight="600" fill="#92400e">Live Segments</text>

  <!-- mia-backend -> brief-notifier Cloud Function -->
  <path d="M 676 232 L 708 232 L 708 358 L 721 358" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="702" y="330" text-anchor="middle" font-size="8.2" font-weight="600" fill="#6d28d9" transform="rotate(-90 702 330)">HTTP POST</text>

  <!-- brief-notifier -> Email (SMTP) -->
  <line x1="838" y1="406" x2="838" y2="455" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="846" y="442" font-size="9" font-weight="600" fill="#5b21b6">SMTP</text>

  <!-- mia-backend -> OpenAI & Google APIs (routed right of VPC badge x=510) -->
  <path d="M 615 190 L 615 174 L 642 174 L 642 126 L 522 126 L 522 92 L 495 92 L 495 75" fill="none" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- mia-search -> OpenAI APIs (routed cleanly left of GKE at x=352) -->
  <path d="M 380 352 L 352 352 L 352 132 L 516 132 L 516 96 L 420 96 L 420 75" fill="none" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- meeting-bot -> ElevenLabs Live API -->
  <path d="M 770 142 L 770 92 L 659 92 L 659 75" fill="none" stroke="#b45309" stroke-width="1.7" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="714" y="86" text-anchor="middle" font-size="8.8" font-weight="700" fill="#92400e">PCM WebSocket</text>

  <!-- meeting-bot <-> Meeting Platforms -->
  <line x1="863" y1="142" x2="863" y2="75" stroke="#047857" stroke-width="1.7" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="871" y="96" font-size="9" font-weight="600" fill="#065f46">WebRTC</text>
</svg>
